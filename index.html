              var val = realFetch || target.fetch;
              Object.defineProperty(target, 'fetch', {
                get: function() { return val; },
                set: function(newFetch) { val = newFetch; },

              });
            } catch (e) {}

            fixFetchOnTarget(Window.prototype);
          }
          if (typeof window !== 'undefined') {
            fixFetchOnTarget(window);
          }
          if (typeof globalThis !== 'undefined') {
            fixFetchOnTarget(globalThis);
          }
          if (typeof self !== 'undefined') {
            fixFetchOnTarget(self);
          }
